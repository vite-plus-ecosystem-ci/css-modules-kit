packages:
  - 'packages/*'
  - 'crates/*'
  # The language server loads a content mapper only from a node_modules inside a workspace folder.
  - 'examples/7-content-mapper'
allowBuilds:
  '@vscode/vsce-sign': false
  esbuild: false
  keytar: false
minimumReleaseAge: 4320
minimumReleaseAgeExclude:
  # ecosystem-ci smoke test: preview builds and freshly pinned toolchain packages
  - vite-plus
  - '@voidzero-dev/*'
  - oxlint
  - '@oxlint/*'
  - oxfmt
  - '@oxfmt/*'
  - oxlint-tsgolint
  - '@oxlint-tsgolint/*'
  - vitest
  - '@vitest/*'
  - tinybench
  - yuku-core
  - yuku-parser
  - '@yuku-core/*'
  - '@yuku-toolchain/*'
  - '@mizdra/*'
  # Ecosystem-ci smoke test: Vite+ core pins freshly published oxc packages.
  - '@oxc-project/*'
  # The typescript nightly (and its native binary packages) pinned for the content-mapper e2e tests.
  # Unlike the other devDependencies, it is installed in packages/content-mapper instead of the root:
  # in the root, pnpm would link its `tsc` (the higher version) in place of the `tsc` of typescript 6.
  # Keep the versions below in sync with the typescript devDependency of packages/content-mapper.
  - typescript@7.1.0-dev.20261030.1
  - '@typescript/typescript-darwin-arm64@7.1.0-dev.20261030.1'
  - '@typescript/typescript-darwin-x64@7.1.0-dev.20261030.1'
  - '@typescript/typescript-linux-arm@7.1.0-dev.20261030.1'
  - '@typescript/typescript-linux-arm64@7.1.0-dev.20261030.1'
  - '@typescript/typescript-linux-x64@7.1.0-dev.20261030.1'
  - '@typescript/typescript-win32-arm64@7.1.0-dev.20261030.1'
  - '@typescript/typescript-win32-x64@7.1.0-dev.20261030.1'
catalog:
  vite: npm:@voidzero-dev/vite-plus-core@0.0.0-commit.a86fd1603196e23718d16144a472ad91b4ba21be
  vite-plus: 0.0.0-commit.a86fd1603196e23718d16144a472ad91b4ba21be
  vitest: 5.1.0
  '@vitest/coverage-v8': 5.1.0
overrides:
  vite@*: 'catalog:'
  vitest@*: 'catalog:'
peerDependencyRules:
  allowAny:
    - vite
    - vitest
  allowedVersions:
    vite: '*'
    vitest: '*'
